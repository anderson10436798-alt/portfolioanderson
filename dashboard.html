<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="description" content="Área administrativa restrita para cadastro de novos projetos.">
    <title>Dashboard | Portfólio</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="header">
        <div class="logo">
            <a href="index.html">Anderson.dev</a>
        </div>
        <nav class="nav" aria-label="Menu principal">
            <a href="index.html">Início</a>
            <a href="quemsoueu.html">Quem sou eu</a>
            <a href="portfolio.html">Portfólio</a>
            <a href="login.html" class="lock-icon" aria-label="Acesso restrito ao painel" title="Área Restrita">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </a>
        </nav>
    </header>

    <main class="container">
        <h1>Dashboard</h1>
        <p class="subtitle">Área restrita para cadastrar um novo projeto do portfólio.</p>

        <section class="dashboard-form-section">
            <h2>Cadastrar projeto</h2>
            <form id="projeto-form">
                <div class="form-group">
                    <label for="titulo">Título</label>
                    <input type="text" id="titulo" name="titulo" placeholder="Ex: Sistema Escolar Local" required>
                </div>

                <div class="form-group">
                    <label for="descricao">Descrição</label>
                    <textarea id="descricao" name="descricao" rows="4" placeholder="Descreva o projeto..." required></textarea>
                </div>

                <div class="form-group">
                    <label for="imagem">Imagem</label>
                    <input type="text" id="imagem" name="imagem" placeholder="Ex: img/projeto.webp" required>
                </div>

                <div class="form-group">
                    <label for="link">Link</label>
                    <input type="url" id="link" name="link" placeholder="https://exemplo.com" required>
                </div>

                <button type="submit" class="btn btn-primary">Salvar projeto</button>
            </form>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Anderson · Escola Estadual Dr. João Beraldo · Carlos Chagas - MG</p>
        <div class="social-footer">
            <a href="quemsoueu.html">Contato</a> |
            <a href="portfolio.html">Portfólio</a>
        </div>
    </footer>

</body>
</html>
